<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Venue-Ready — social share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
    background:#1E3D2F; color:#FAF7F0; overflow:hidden; position:relative;
    padding:72px 84px; display:flex; flex-direction:column; justify-content:center;
  }
  /* brass rule top + bottom */
  body::before{content:""; position:absolute; left:0; right:0; top:0; height:14px;
    background:repeating-linear-gradient(90deg,#B08D3E 0 70px,transparent 70px 92px)}
  body::after{content:""; position:absolute; left:0; right:0; bottom:0; height:14px;
    background:repeating-linear-gradient(90deg,#B08D3E 0 70px,transparent 70px 92px)}
  .seal{position:absolute; top:64px; right:84px; width:104px; height:104px; border-radius:50%;
    background:#152B21; border:4px solid #B08D3E; color:#C9A85C; display:flex; align-items:center; justify-content:center;
    font-family:'Young Serif',serif; font-size:40px}
  .eyebrow{font-size:22px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:#C9A85C; margin-bottom:22px}
  h1{font-family:'Young Serif',Georgia,serif; font-weight:400; font-size:70px; line-height:1.08; color:#fff; max-width:900px}
  h1 em{font-style:normal; color:#C9A85C}
  .rule{width:150px; height:5px; background:#B08D3E; margin:30px 0}
  .tag{font-size:30px; color:#E7E3D6; font-weight:700}
</style>
</head>
<body>
  <div class="seal">VR</div>
  <div class="eyebrow">Venue-Ready · Martyn's Law readiness</div>
  <h1>Get your church or village hall ready <em>in one afternoon.</em></h1>
  <div class="rule"></div>
  <div class="tag">Ready in one afternoon — £149 once</div>
</body>
</html>
